<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial" font-size="28" font-weight="700" fill="#202124">
    Praktische OpenSSL Befehle
  </text>

  <rect x="40" y="80" width="900" height="70" rx="12" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
  <text x="60" y="122" font-family="Courier New" font-size="22" fill="#174EA6">
    openssl x509 -in tls.crt -text -noout
  </text>

  <rect x="40" y="175" width="900" height="70" rx="12" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
  <text x="60" y="217" font-family="Courier New" font-size="22" fill="#0D652D">
    openssl pkey -in tls.key -text -noout
  </text>

  <rect x="40" y="270" width="900" height="70" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="3"/>
  <text x="60" y="312" font-family="Courier New" font-size="22" fill="#7A4B00">
    openssl pkcs12 -in client.p12 -info
  </text>

  <rect x="40" y="365" width="900" height="70" rx="12" fill="#FCE8E6" stroke="#D93025" stroke-width="3"/>
  <text x="60" y="407" font-family="Courier New" font-size="22" fill="#A50E0E">
    openssl x509 -in tls.crt -pubkey -noout
  </text>

  <rect x="40" y="450" width="900" height="45" rx="12" fill="#F1F3F4" stroke="#5F6368" stroke-width="2"/>
  <text x="60" y="480" font-family="Arial" font-size="18" fill="#202124">
    Public Keys aus Zertifikat und Key vergleichen, um passende Paare zu prüfen
  </text>
</svg>
