<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410" role="img" aria-label="Zwei Zertifikatsketten bei Proxy und Client Authentifikation">
  <rect width="980" height="410" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202124">Zwei unabhängige Zertifikatsketten</text>

  <rect x="65" y="95" width="380" height="260" rx="18" fill="#F8FAFD" stroke="#1A73E8" stroke-width="3"/>
  <text x="95" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#174EA6">A: Browser prüft Proxy</text>
  <text x="105" y="185" font-family="Arial, sans-serif" font-size="20" fill="#202124">Proxy Leaf für ziel.de</text>
  <text x="105" y="225" font-family="Arial, sans-serif" font-size="20" fill="#202124">→ Proxy Intermediate</text>
  <text x="105" y="265" font-family="Arial, sans-serif" font-size="20" fill="#202124">→ Firmen Root im Container</text>

  <rect x="535" y="95" width="380" height="260" rx="18" fill="#F8FAFD" stroke="#188038" stroke-width="3"/>
  <text x="565" y="135" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0D652D">B: Proxy prüft Client</text>
  <text x="575" y="185" font-family="Arial, sans-serif" font-size="20" fill="#202124">Client Leaf</text>
  <text x="575" y="225" font-family="Arial, sans-serif" font-size="20" fill="#202124">→ Client Intermediate</text>
  <text x="575" y="265" font-family="Arial, sans-serif" font-size="20" fill="#202124">→ Firmen Root im Proxy</text>
</svg>
