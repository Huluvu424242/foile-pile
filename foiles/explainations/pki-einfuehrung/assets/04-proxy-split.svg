<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Proxy trennt TLS in zwei Verbindungen">
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202124">Unternehmensproxy: zwei getrennte TLS-Verbindungen</text>

  <rect x="45" y="135" width="215" height="95" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
  <text x="75" y="175" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#174EA6">Selenium</text>
  <text x="78" y="204" font-family="Arial, sans-serif" font-size="19" fill="#174EA6">Chrome Headless</text>

  <rect x="385" y="115" width="230" height="135" rx="14" fill="#FEF7E0" stroke="#F9AB00" stroke-width="3"/>
  <text x="430" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#7A4B00">Firmenproxy</text>
  <text x="423" y="196" font-family="Arial, sans-serif" font-size="19" fill="#5F6368">terminiert TLS</text>
  <text x="424" y="223" font-family="Arial, sans-serif" font-size="19" fill="#5F6368">prüft Inhalte</text>

  <rect x="740" y="135" width="190" height="95" rx="14" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
  <text x="778" y="177" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0D652D">Internet</text>
  <text x="768" y="205" font-family="Arial, sans-serif" font-size="19" fill="#0D652D">Webseite</text>

  <line x1="260" y1="182" x2="385" y2="182" stroke="#5F6368" stroke-width="5"/>
  <polygon points="385,182 365,170 365,194" fill="#5F6368"/>
  <text x="285" y="158" font-family="Arial, sans-serif" font-size="18" fill="#5F6368">mTLS</text>

  <line x1="615" y1="182" x2="740" y2="182" stroke="#5F6368" stroke-width="5"/>
  <polygon points="740,182 720,170 720,194" fill="#5F6368"/>
  <text x="650" y="158" font-family="Arial, sans-serif" font-size="18" fill="#5F6368">TLS</text>

  <text x="70" y="300" font-family="Arial, sans-serif" font-size="20" fill="#202124">Client-Zertifikat beweist Firmenzugehörigkeit</text>
  <text x="455" y="330" font-family="Arial, sans-serif" font-size="20" fill="#202124">Proxy erzeugt dynamisch Server-Zertifikat</text>
</svg>
