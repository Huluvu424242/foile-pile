<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Man in the middle Problem ohne Zertifikate">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202124">Ohne Zertifikat: Welcher Public Key ist echt?</text>

  <rect x="55" y="120" width="190" height="90" rx="14" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
  <text x="104" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#174EA6">Browser</text>

  <rect x="385" y="95" width="210" height="140" rx="14" fill="#FCE8E6" stroke="#D93025" stroke-width="3"/>
  <text x="430" y="142" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#A50E0E">Angreifer</text>
  <text x="420" y="182" font-family="Arial, sans-serif" font-size="19" fill="#5F6368">sendet eigenen</text>
  <text x="430" y="208" font-family="Arial, sans-serif" font-size="19" fill="#5F6368">Public Key</text>

  <rect x="715" y="120" width="190" height="90" rx="14" fill="#E6F4EA" stroke="#188038" stroke-width="3"/>
  <text x="765" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0D652D">Server</text>

  <line x1="245" y1="165" x2="385" y2="165" stroke="#5F6368" stroke-width="5"/>
  <polygon points="385,165 365,154 365,176" fill="#5F6368"/>
  <line x1="595" y1="165" x2="715" y2="165" stroke="#5F6368" stroke-width="5"/>
  <polygon points="715,165 695,154 695,176" fill="#5F6368"/>

  <text x="258" y="145" font-family="Arial, sans-serif" font-size="18" fill="#5F6368">vertraut falsch</text>
  <text x="612" y="145" font-family="Arial, sans-serif" font-size="18" fill="#5F6368">leitet weiter</text>
</svg>
