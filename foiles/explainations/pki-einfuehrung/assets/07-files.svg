<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="tls.cert und tls.key Inhalt">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="40" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#202124">Dateien: Zertifikat, Chain und Private Key</text>

  <rect x="90" y="105" width="330" height="170" rx="18" fill="#E8F0FE" stroke="#1A73E8" stroke-width="3"/>
  <text x="130" y="150" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#174EA6">tls.cert</text>
  <text x="130" y="195" font-family="Arial, sans-serif" font-size="20" fill="#202124">Client Leaf</text>
  <text x="130" y="230" font-family="Arial, sans-serif" font-size="20" fill="#202124">+ Intermediate Chain</text>

  <rect x="540" y="105" width="330" height="170" rx="18" fill="#FCE8E6" stroke="#D93025" stroke-width="3"/>
  <text x="580" y="150" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#A50E0E">tls.key</text>
  <text x="580" y="195" font-family="Arial, sans-serif" font-size="20" fill="#202124">Private Key</text>
  <text x="580" y="230" font-family="Arial, sans-serif" font-size="20" fill="#202124">niemals weitergeben</text>
</svg>
