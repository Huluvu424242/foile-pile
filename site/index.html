<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foile Pile – Präsentationsportal</title>
    <link rel="stylesheet" href="portal.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Foile Pile</h1>
      <p class="subtitle">Übersicht aller verfügbaren Präsentationen</p>
    </header>

    <main class="content" aria-live="polite">
      <section class="toolbar" aria-label="Suche und Sortierung">
        <label class="toolbar-field" for="search-input">
          <span>Suche</span>
          <input
            id="search-input"
            name="search"
            type="search"
            placeholder="Titel, Tags oder Beschreibung durchsuchen …"
            autocomplete="off"
          />
        </label>

        <label class="toolbar-field toolbar-field--sort" for="sort-select">
          <span>Sortierung</span>
          <select id="sort-select" name="sort">
            <option value="relevance">Relevanz</option>
            <option value="alphabet">Alphabetisch (A–Z)</option>
          </select>
        </label>
      </section>

      <section class="filters" aria-label="Filter und Facetten">
        <fieldset class="filter-group">
          <legend>Tags</legend>
          <div id="tag-filters" class="filter-options"></div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>Sprache</legend>
          <div id="language-filters" class="filter-options"></div>
        </fieldset>

        <fieldset class="filter-group">
          <legend>Bereich</legend>
          <div id="category-filters" class="filter-options"></div>
        </fieldset>
      </section>

      <section id="active-filters" class="active-filters" aria-label="Aktive Filter" hidden>
        <p class="active-filters__title">Aktive Filter:</p>
        <div id="active-filter-chips" class="active-filter-chips"></div>
      </section>

      <p id="result-summary" class="result-summary" hidden></p>
      <p id="status-message" class="status-message" hidden></p>

      <ul id="presentation-list" class="presentation-list" hidden></ul>
    </main>

    <script src="portal.js" defer></script>
  </body>
</html>
